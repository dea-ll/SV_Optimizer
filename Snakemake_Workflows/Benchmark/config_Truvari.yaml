    chunksize: 1000
    vcf_hg002: "/path/to/benchmark_vcfs/SurVeyor/Unfiltered_VCF_Files/GIAB_HG_002.genome.deduped.20260204"  

################################################################################
# Path to filtered vcf files according to the SVTYPE and SVLEN
################################################################################

paths:
  filtered_vcf_dir: "/path/to/filtered_vcf_files"

################################################################################
# Truvari Parameter Testing Configurations
################################################################################

truvari_configs:
  truvari_default:
    pctseq: 0.7
    pctsize: 0.7
    pctovl: 0.0

  overlap_50:
    pctseq: 0.0
    pctsize: 0.0
    pctovl: 0.5

  overlap_70:
    pctseq: 0.0
    pctsize: 0.0
    pctovl: 0.7

  rd_depth:
    pctseq: 0.0      
    pctsize: 0.5     
    pctovl: 0.5      

# Select which configurations to run
active_configs:
  - truvari_default
  - overlap_50
  - overlap_70
  - rd_depth

################################################################################
# Samples to benchmark
# Define your sample names and their corresponding VCF key in tools
################################################################################

samples:
  - name: "HG002"
    vcf_key: "vcf_hg002"
    

################################################################################
# Truthset Configurations (Generic)
# 
# Modify only the vcf and bed paths below for your specific truthsets
# RAW: unfiltered Illumina variants
# FILTERED: Illumina-only variants (ILLMP_ALT > 5)
################################################################################

truthsets:
  RAW:
    vcf: "/path/to/truthset/Raw/HG002_SVs_Tier1_v0.6.vcf.gz"
    bed: "/path/to/truthset/Raw/HG002_SVs_Tier1_v0.6.bed"
    
  FILTERED:
    vcf: "/path/to/truthset/Filtered/HG002_SVs_Tier1_IlluminaOnly.v0.6.vcf.gz"
    bed: "/path/to/truthset/Raw/HG002_SVs_Tier1_v0.6.bed"

  FILTERED_RD:
    vcf: "/path/to/truthset/RD_truth/HG002_SVs_Tier1_RD_recall_relaxed.vcf.gz"
    bed: "/path/to/truthset/Raw/HG002_SVs_Tier1_v0.6.bed"

truthsets_split:
  DEL_50to10kb:
    vcf: "/path/to/truthset/Split/HG002_SVs_Tier1_DEL_50to10kb.vcf.gz"
  DEL_gt10kb:
    vcf: "/path/to/truthset/Split/HG002_SVs_Tier1_DEL_gt10kb.vcf.gz"
  DUP_all:
    vcf: "/path/to/truthset/Split/HG002_SVs_Tier1_DUP_all.vcf.gz"
